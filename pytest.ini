[pytest]
asyncio_mode = auto
pythonpath = src
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = -v --tb=short --strict-markers
markers =
    integration: integration tests touching multiple modules
    negative: negative / error path tests
    slow: slow tests
filterwarnings =
    # passlib (unmaintained) reads argon2.__version__; harmless, nothing to fix on our side
    ignore:Accessing argon2.__version__ is deprecated:DeprecationWarning:passlib
