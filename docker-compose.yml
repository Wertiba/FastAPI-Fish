# One image, four processes (api, worker, scheduler, bot) and the infrastructure they use.
#   docker compose up -d --build                        api + worker + scheduler + Postgres, Redis, Kafka, MinIO
#   docker compose --profile telegram up -d             + bot (needs TELEGRAM_BOT_TOKEN in src/.env)
#   docker compose --profile llm up -d                  + Ollama; then: docker compose exec ollama ollama pull qwen2.5:7b
#                                                       (without it the app runs; LLM calls answer 503)
# Values in `environment` point the processes at the containers and override src/.env.

x-app: &app
  build: .
  env_file: src/.env
  environment: &app-env
    DB_HOST: db
    DB_PORT: 5432
    REDIS_URL: redis://redis:6379/0
    KAFKA_BOOTSTRAP_SERVERS: kafka:9092
    S3_ENDPOINT_URL: http://minio:9000
    S3_BUCKET: ${S3_BUCKET:-app}
    S3_ACCESS_KEY: ${MINIO_ROOT_USER:-minio}
    S3_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-minio-password}
    OLLAMA_URL: http://ollama:11434  # without the llm profile, LLM calls answer 503
    RUN_MIGRATIONS: "false"
  depends_on:
    db:
      condition: service_healthy
    redis:
      condition: service_healthy
    kafka:
      condition: service_healthy
    minio-bucket:
      condition: service_completed_successfully
  restart: unless-stopped

services:
  api:
    <<: *app
    command: ["python", "-m", "app.run", "api"]
    environment:
      <<: *app-env
      RUN_MIGRATIONS: "true"  # only the api migrates; the others start after it is healthy
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8080/health/readiness')"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 15s

  worker:
    <<: *app
    command: ["python", "-m", "app.run", "worker"]
    depends_on: &after-api
      api:
        condition: service_healthy

  scheduler:
    <<: *app
    command: ["python", "-m", "app.run", "scheduler"]
    depends_on: *after-api

  bot:
    <<: *app
    profiles: [telegram]
    command: ["python", "-m", "app.run", "bot"]
    depends_on: *after-api

  db:
    image: postgres:17-alpine
    env_file: src/.env
    volumes:
      - db_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  kafka:
    image: apache/kafka:3.9.1
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      # PLAINTEXT for the containers, EXTERNAL (localhost:29092) for `make run-worker` on the host.
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093,EXTERNAL://:29092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,EXTERNAL://localhost:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    volumes:
      - kafka_data:/var/lib/kafka/data
    ports:
      - "29092:29092"
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 > /dev/null"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 20s

  minio:
    image: minio/minio:latest
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minio}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minio-password}
    volumes:
      - minio_data:/data
    ports:
      - "9000:9000"  # S3 API
      - "9001:9001"  # web console
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 3s
      retries: 10

  minio-bucket:  # creates the bucket once and exits
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      sh -c "mc alias set local http://minio:9000 $${MINIO_ROOT_USER} $${MINIO_ROOT_PASSWORD}
      && mc mb --ignore-existing local/$${S3_BUCKET}"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minio}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minio-password}
      S3_BUCKET: ${S3_BUCKET:-app}

  ollama:
    image: ollama/ollama:latest
    profiles: [llm]
    volumes:
      - ollama_data:/root/.ollama
    ports:
      - "11434:11434"
    restart: unless-stopped
    # With an NVIDIA GPU and the container toolkit, uncomment:
    # deploy:
    #   resources:
    #     reservations:
    #       devices: [{ driver: nvidia, count: all, capabilities: [gpu] }]

volumes:
  db_data:
  kafka_data:
  minio_data:
  ollama_data:
