[project]
name = "fish-modular"
version = "0.1.0"
description = "FastAPI template: clean architecture (domain / application / infra / presentation), Dishka DI, JWT auth, users CRUD"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.120",
    "uvicorn[standard]>=0.30",
    "dishka>=1.6",
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30",
    "alembic>=1.14",
    "pydantic[email]>=2.11",
    "pyjwt>=2.9",
    "argon2-cffi>=23.1",
    "prometheus-client>=0.21",
]

[dependency-groups]
dev = [
    "aiosqlite>=0.20",
    "httpx>=0.27",
    "pytest>=8.3,!=9.1.1",  # 9.1.1 crashes on collection (CollectionArgument.r)
    "pytest-asyncio>=0.24",
    "pytest-cov>=5.0",
    "ruff>=0.8",
    "mypy>=1.13",
]

[build-system]
requires = ["uv_build>=0.11,<0.12"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "app"

# ---------------------------------------------------------------- pytest
[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
pythonpath = ["src", "."]
testpaths = ["tests"]
addopts = "-q --strict-markers"
markers = ["integration: tests that need a real PostgreSQL (TEST_DB_URL env var)"]

[tool.coverage.run]
source = ["app"]
branch = true

# ---------------------------------------------------------------- ruff
[tool.ruff]
target-version = "py313"
line-length = 120
src = ["src", "tests"]
extend-exclude = ["alembic/versions"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "B", "C4", "S", "SIM", "RUF", "DTZ", "T20", "PT", "ASYNC"]
ignore = [
    "B008",    # FastAPI Depends()/Query() in defaults
    "UP046",   # Generic[T] читается привычнее PEP 695 и одинаково работает с pydantic
    "RUF001", "RUF002", "RUF003",  # кириллица в строках/комментариях
]

[tool.ruff.lint.isort]
known-first-party = ["app", "tests"]
known-third-party = ["alembic"]  # not the local alembic/ migrations folder

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106"]
"scripts/**" = ["T201", "S603", "S607"]

# ---------------------------------------------------------------- mypy
[tool.mypy]
python_version = "3.13"
mypy_path = "src"
packages = ["app"]
strict = true
plugins = ["pydantic.mypy"]
warn_unused_ignores = false

[[tool.mypy.overrides]]
module = ["prometheus_client.*"]
ignore_missing_imports = true
