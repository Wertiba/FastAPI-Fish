[project]
name = "fish-modular"
version = "0.1.0"
description = "FastAPI template: clean architecture (domain / application / infra / presentation), Dishka DI, JWT auth, users CRUD"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.120",
    "uvicorn[standard]>=0.30",
    "dishka>=1.6",
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30",
    "alembic>=1.14",
    "pydantic[email]>=2.11",
    "pyjwt>=2.9",
    "argon2-cffi>=23.1",
    "prometheus-client>=0.21",
]

[dependency-groups]
dev = [
    "aiosqlite>=0.20",
    "httpx>=0.27",
    "pytest>=8.3,!=9.1.1",  # 9.1.1 crashes on collection (CollectionArgument.r)
    "pytest-asyncio>=0.24",
    "pytest-cov>=5.0",
    "ruff==0.14.13",  # preview-правила меняются от версии к версии: как в main
    "mypy>=1.13",
]

[build-system]
requires = ["uv_build>=0.11,<0.12"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "app"

# ---------------------------------------------------------------- pytest
[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
pythonpath = ["src", "."]
testpaths = ["tests"]
addopts = "-q --strict-markers"
markers = ["integration: tests that need a real PostgreSQL (TEST_DB_URL env var)"]

[tool.coverage.run]
source = ["app"]
branch = true

# ---------------------------------------------------------------- ruff
[tool.ruff]
# target-version берётся из requires-python (>=3.13 -> py313)
line-length = 120 # Максимальная длина строки для кода
indent-width = 4 # Ширина отступа
# Каталоги, которые следует учитывать при разрешении импорта из first/third-party источников
src = ["src"]
# Дополняет (а не заменяет) стандартные исключения ruff: .venv, .git, __pycache__ и т.д.
extend-exclude = [
    "tests",
    "src/alembic",
    ".claude"
]

[tool.ruff.lint]
# Нестабильные и находящиеся в предварительной версии правила
preview = true
# Правила, которые должен применять линтер
select = [
    "UP",   # pyupgrade
    "I",    # isort
    "E",    # flake8-errors
    "W",    # flake8-warnings
    "F",    # flake8-pyflakes
    "B",    # flake8-bugbear
    "C4",   # flake8-comprehensions
    "S",    # flake8-bandit
    "BLE",  # flake8-blind-except
    "T20",  # flake8-print
    "T10",  # flake8-debugger
    "PT",   # flake8-pytest-style
    "RUF",  # Ruff
    "DTZ",  # flake8-datetimez
    "ERA",  # eradicate
    "FURB", # refurb
]
# Игнорирование конкретных предупреждений линтера
ignore = [
    "C408",    # Ненужный вызов dict, list и т.д.
    "RUF001",  # Игнорирование похожих символов с разными ASCII
    "RUF002",  # Игнорирование похожих символов с разными ASCII
    "RUF003",  # Игнорирование похожих символов с разными ASCII
    "S110",    # try-except-pass
    "UP015",   # Remove mode argument
    "RUF100",  # комментарии noqa
    "UP046",   # Generic
    "RUF067",  # __init__ only
    "B008",
    "BLE001",
    "FURB167",
    "UP017",
    "RUF012",
    "UP042",   # enum classes
    "E741",    # one letter variables
]
# Ошибки, которые могут быть исправлены автоматически
fixable = [
    "I",      # сортировка импортов
    "E3",     # заполнение пустых строк
    "RUF022", # сортировка значений списка
    "E501",   # line too long
]

[tool.ruff.lint.per-file-ignores]
"scripts/**" = ["T201", "S404", "S603", "S607"] # CLI-скрипты: print — это их вывод, генератор вызывает uv

[tool.ruff.lint.flake8-bandit]
check-typed-exception = true # Проверка типизированных исключений

[tool.ruff.format]
quote-style = "double" # 'single' для одинарных, "double" для двойных кавычек
indent-style = "space"

# ---------------------------------------------------------------- mypy
[tool.mypy]
python_version = "3.13"
mypy_path = "src"
packages = ["app"]
strict = true
plugins = ["pydantic.mypy"]
warn_unused_ignores = false

[[tool.mypy.overrides]]
module = ["prometheus_client.*"]
ignore_missing_imports = true
