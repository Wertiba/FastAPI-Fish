app:
  name: FastAPI-Fish

run:
  host: 0.0.0.0
  port: 8080

logging:
  console:
    level: INFO
    enqueue: true
    backtrace: true
    diagnose: true
    format: "<green>{time:YYYY-MM-DD HH:mm:ss.SSS}</green> | <level>{level: <8}</level> | <cyan>{name}</cyan>:<cyan>{function}</cyan>:<cyan>{line}</cyan> | <level>{message}</level>"
  file:
    path: logs/app.log
    rotation: 10 MB
    retention: 10 days
    compression: zip
    level: INFO
    enqueue: true
    backtrace: true
    diagnose: false

token:
  default_type: bearer
  schema: argon2
  access_token:
    lifetime_seconds: 3600
    algorithm: HS256
    expire_minutes: 120
  refresh_token:
    expire_days: 15

db:
  driver: postgresql+asyncpg
  echo: false
  echo_pool: false
  pool_size: 50
  max_overflow: 10
