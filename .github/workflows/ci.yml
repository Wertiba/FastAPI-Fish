name: CI

on:
  push:
    branches-ignore: [main]  # main is covered by cd.yml, which calls this workflow
  workflow_call:
  workflow_dispatch:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.9.16"
          enable-cache: true
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy

  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: app_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      DB_HOST: localhost
      DB_PORT: "5432"
      DB_NAME: app_test
      DB_USER: postgres
      DB_PASSWORD: postgres
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.9.16"
          enable-cache: true
      - run: uv sync --locked
      - name: Unit tests (in-memory SQLite, incl. OpenAPI contract with FastAPI-Fish)
        run: uv run python -m pytest --cov=app --cov-report= -v
      - name: Migrations apply cleanly and match the models
        run: |
          uv run alembic -c src/alembic.ini upgrade head
          uv run alembic -c src/alembic.ini check
          uv run alembic -c src/alembic.ini downgrade base
      - name: Integration tests (PostgreSQL)
        run: uv run python -m pytest --cov=app --cov-append --cov-report=term-missing --cov-report=xml --cov-report=html -v
        env:
          TEST_DB_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/app_test
      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: |
            coverage.xml
            htmlcov
