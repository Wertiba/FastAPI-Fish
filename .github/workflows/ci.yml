name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install -r requirements.txt
      - run: ruff check .

  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install -r requirements.txt
      - run: cp .env.example .env
      - name: Unit tests (in-memory SQLite)
        run: python -m pytest -m "not integration" --cov=app --cov-report= -v
      - name: Integration tests (Testcontainers Postgres)
        run: python -m pytest -m integration --cov=app --cov-append --cov-report=term-missing --cov-report=xml --cov-report=html -v
      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: |
            src/coverage.xml
            src/htmlcov
